AWSTemplateFormatVersion: "2010-09-09"
Description: BenchBoss — Discord Bot on AWS App Runner

Parameters:
  DiscordPublicKey:
    Type: String
    Description: "Discord app public key (Developer Portal > General Information)"
    NoEcho: true
  DiscordToken:
    Type: String
    Description: "Discord bot token (Developer Portal > Bot > Token)"
    NoEcho: true
  ImageUri:
    Type: String
    Description: "ECR image URI including tag (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/bench-boss:latest)"

Resources:

  # ── DynamoDB ────────────────────────────────────────────────────────────────

  BenchBossTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_key
          AttributeType: S
      KeySchema:
        - AttributeName: event_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: OLD_IMAGE

  # ── IAM ─────────────────────────────────────────────────────────────────────

  # Allows App Runner to pull the image from ECR
  ECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bench-boss-ecr-access-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # Grants the running container access to DynamoDB
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bench-boss-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bench-boss-dynamodb
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:DescribeTable
                Resource: !GetAtt BenchBossTable.Arn
              - Effect: Allow
                Action:
                  - dynamodbstreams:GetRecords
                  - dynamodbstreams:GetShardIterator
                  - dynamodbstreams:DescribeStream
                  - dynamodbstreams:ListStreams
                Resource: !GetAtt BenchBossTable.StreamArn

  # ── App Runner ───────────────────────────────────────────────────────────────

  BenchBossService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: bench-boss
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt ECRAccessRole.Arn
        AutoDeploymentsEnabled: true
        ImageRepository:
          ImageIdentifier: !Ref ImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: DISCORD_PUBLIC_KEY
                Value: !Ref DiscordPublicKey
              - Name: DISCORD_TOKEN
                Value: !Ref DiscordToken
              - Name: DYNAMODB_TABLE
                Value: !Ref BenchBossTable
      InstanceConfiguration:
        Cpu: "256"
        Memory: "512"
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        HealthyThreshold: 1
        UnhealthyThreshold: 5

Outputs:
  InteractionsUrl:
    Description: "Paste into Discord Developer Portal > General Information > Interactions Endpoint URL"
    Value: !Sub "https://${BenchBossService.ServiceUrl}/interactions"