AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: BenchBoss — Discord Bot on AWS Lambda (SnapStart)

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 512

Parameters:
  DiscordPublicKey:
    Type: String
    Description: "Discord app public key (Developer Portal > General Information)"
    NoEcho: true
  DiscordToken:
    Type: String
    Description: "Discord bot token (Developer Portal > Bot > Token)"
    NoEcho: true

Resources:

  BenchBossTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_key
          AttributeType: S
      KeySchema:
        - AttributeName: event_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: OLD_IMAGE

  BenchBossFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: lambda_function.lambda_handler
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BenchBossTable
      Environment:
        Variables:
          DISCORD_PUBLIC_KEY: !Ref DiscordPublicKey
          DISCORD_TOKEN: !Ref DiscordToken
          DYNAMODB_TABLE: !Ref BenchBossTable
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  BenchBossStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 30
      CodeUri: ../
      Handler: stream_lambda_handler.stream_lambda_handler
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BenchBossTable
      Environment:
        Variables:
          DISCORD_TOKEN: !Ref DiscordToken
          DYNAMODB_TABLE: !Ref BenchBossTable
      Events:
        Stream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt BenchBossTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["REMOVE"]}'

Outputs:
  InteractionsUrl:
    Description: "Paste this into Discord Developer Portal > General Information > Interactions Endpoint URL (append /interactions is NOT required — the Function URL is the endpoint)"
    Value: !GetAtt BenchBossFunctionUrl.FunctionUrl