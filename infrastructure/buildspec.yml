version: 0.2

env:
  variables:
    PIPENV_VENV_IN_PROJECT: "1"   # keep virtualenv inside the project dir for caching

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - pip install pipenv --quiet
      - pipenv install --dev

  build:
    commands:
      - make lint
      - make cov

cache:
  paths:
    - .venv/**/*