AWSTemplateFormatVersion: "2010-09-09"
Description: BenchBoss CI/CD pipeline — GitHub -> Build -> Deploy QA -> Manual Approval -> Deploy Prod

Parameters:
  GitHubOwner:
    Type: String
    Default: marcmaniscalco
    Description: GitHub org/user that owns the repository
  RepositoryName:
    Type: String
    Default: BenchBoss
    Description: GitHub repository name (without the owner prefix)
  BranchName:
    Type: String
    Default: main
  QaStackName:
    Type: String
    Default: bench-boss-qa
  ProdStackName:
    Type: String
    Default: bench-boss-prod
  QaSecretName:
    Type: String
    Default: bench-boss/qa
    Description: Secrets Manager secret holding QA Discord credentials as JSON
  ProdSecretName:
    Type: String
    Default: bench-boss/prod
    Description: Secrets Manager secret holding Prod Discord credentials as JSON

Resources:

  # ────────────────────────────────────────────────────────────────────────────
  # Artifact bucket — stores source archives, build outputs, packaged Lambda zip
  # ────────────────────────────────────────────────────────────────────────────
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ────────────────────────────────────────────────────────────────────────────
  # GitHub connection — after this stack deploys, open AWS Console →
  # Developer Tools → Settings → Connections and click "Update pending
  # connection" to complete the GitHub OAuth handshake once. The pipeline's
  # Source stage will not work until the connection status is "Available".
  # ────────────────────────────────────────────────────────────────────────────
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub "${AWS::StackName}-github"
      ProviderType: GitHub

  # ────────────────────────────────────────────────────────────────────────────
  # CodeBuild — runs lint + tests, then sam build / sam package
  # ────────────────────────────────────────────────────────────────────────────
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-build"
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ARTIFACT_BUCKET
            Value: !Ref ArtifactBucket
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml

  # ────────────────────────────────────────────────────────────────────────────
  # CloudFormation deploy role — used by the Deploy stages to apply the SAM
  # template. Scoped to AdministratorAccess because SAM creates IAM roles,
  # Lambda functions, DynamoDB tables, event source mappings, and Function URLs.
  # Tighten this for stricter environments.
  # ────────────────────────────────────────────────────────────────────────────
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  # ────────────────────────────────────────────────────────────────────────────
  # CodePipeline role
  # ────────────────────────────────────────────────────────────────────────────
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnection
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt BuildProject.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeChangeSet
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn

  # ────────────────────────────────────────────────────────────────────────────
  # The pipeline
  # A CodeStarSourceConnection source action triggers automatically on push
  # via a GitHub webhook — no separate EventBridge rule needed.
  # ────────────────────────────────────────────────────────────────────────────
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Sub "${GitHubOwner}/${RepositoryName}"
                BranchName: !Ref BranchName
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact

        - Name: Build
          Actions:
            - Name: BuildAndTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact

        - Name: DeployQA
          Actions:
            - Name: DeployQA
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref QaStackName
                TemplatePath: BuildArtifact::packaged.yaml
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CloudFormationRole.Arn
                ParameterOverrides: !Sub |
                  {
                    "DiscordPublicKey": "{{resolve:secretsmanager:${QaSecretName}:SecretString:DiscordPublicKey}}",
                    "DiscordToken": "{{resolve:secretsmanager:${QaSecretName}:SecretString:DiscordToken}}"
                  }
              InputArtifacts:
                - Name: BuildArtifact

        - Name: ApproveProd
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                CustomData: "Approve to promote the QA build to Production."

        - Name: DeployProd
          Actions:
            - Name: DeployProd
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref ProdStackName
                TemplatePath: BuildArtifact::packaged.yaml
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CloudFormationRole.Arn
                ParameterOverrides: !Sub |
                  {
                    "DiscordPublicKey": "{{resolve:secretsmanager:${ProdSecretName}:SecretString:DiscordPublicKey}}",
                    "DiscordToken": "{{resolve:secretsmanager:${ProdSecretName}:SecretString:DiscordToken}}"
                  }
              InputArtifacts:
                - Name: BuildArtifact

Outputs:
  PipelineUrl:
    Description: Console URL for the pipeline
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view"
  ArtifactBucket:
    Description: Bucket where pipeline artifacts and Lambda packages are stored
    Value: !Ref ArtifactBucket
  GitHubConnectionArn:
    Description: >-
      CodeStar Connections ARN. After the first deploy this connection sits
      in PENDING status — open it in the console (Developer Tools > Settings
      > Connections) and click "Update pending connection" to complete the
      GitHub OAuth handshake before the pipeline can pull source.
    Value: !Ref GitHubConnection