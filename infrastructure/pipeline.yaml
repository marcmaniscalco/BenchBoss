AWSTemplateFormatVersion: "2010-09-09"
Description: BenchBoss CI/CD pipeline — GitHub -> Build -> Deploy QA -> Cleanup -> Integration Test -> Manual Approval -> Deploy Prod -> Cleanup

Parameters:
  GitHubOwner:
    Type: String
    Default: marcmaniscalco
    Description: GitHub org/user that owns the repository
  RepositoryName:
    Type: String
    Default: BenchBoss
    Description: GitHub repository name (without the owner prefix)
  BranchName:
    Type: String
    Default: main
  QaStackName:
    Type: String
    Default: bench-boss-qa
  ProdStackName:
    Type: String
    Default: bench-boss-prod
  QaSecretName:
    Type: String
    Default: bench-boss/qa
    Description: Secrets Manager secret holding QA Discord credentials as JSON
  ProdSecretName:
    Type: String
    Default: bench-boss/prod
    Description: Secrets Manager secret holding Prod Discord credentials as JSON
  QaTestSigningSecretName:
    Type: String
    Default: bench-boss/qa-test-signing-key
    Description: >-
      Secrets Manager secret holding the QA-only Ed25519 test-signing keypair
      (TestPublicKey, TestSigningPrivateKey) used by the IntegrationTest
      stage to sign real requests against the deployed QA Lambda. Separate
      from QaSecretName so the integration test role never needs access to
      the real Discord bot token.
  GitHubConnectionArn:
    Type: String
    Default: arn:aws:codeconnections:us-east-1:629520208838:connection/20e2ba2a-cd39-4912-850c-004bf1461bb7
    Description: >-
      ARN of an existing CodeConnections connection to GitHub. Not a
      CloudFormation-managed resource: a connection only enables webhook-based
      triggering once the underlying GitHub App is actually installed (with
      repository access granted), and that install step only happens through
      the console (Settings > Connections > Create connection > Connect to
      GitHub > Install a new app) — CloudFormation can create a Connection
      resource, but can't drive that install flow. Authorizing a connection
      without installing the app (or reusing one that was never installed)
      leaves it "Available" and able to pull source, but silently without a
      working webhook, so the pipeline only ever runs when started manually.

Resources:

  # ────────────────────────────────────────────────────────────────────────────
  # Artifact bucket — stores source archives, build outputs, packaged Lambda zip
  # ────────────────────────────────────────────────────────────────────────────
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ────────────────────────────────────────────────────────────────────────────
  # CodeBuild — runs lint + tests, then sam build / sam package
  # ────────────────────────────────────────────────────────────────────────────
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-build"
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ARTIFACT_BUCKET
            Value: !Ref ArtifactBucket
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml

  # ────────────────────────────────────────────────────────────────────────────
  # IntegrationTest CodeBuild — runs the post-deploy QA smoke test. Scoped to
  # its own secret (QaTestSigningSecretName) so it can never read the real
  # Discord bot token in QaSecretName.
  # ────────────────────────────────────────────────────────────────────────────
  IntegrationTestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IntegrationTestPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${QaTestSigningSecretName}-*"

  IntegrationTestProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-integration-test"
      ServiceRole: !GetAtt IntegrationTestRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: QA_TEST_SIGNING_SECRET_NAME
            Value: !Ref QaTestSigningSecretName
      Source:
        Type: CODEPIPELINE
        BuildSpec: integration-buildspec.yml

  # ────────────────────────────────────────────────────────────────────────────
  # Cleanup CodeBuild — deletes unused Lambda versions after every deploy, so
  # SnapStart doesn't keep billing to cache snapshots nobody uses. Shared by
  # both CleanupQA and CleanupProd stages (STACK_NAME set per-action via
  # EnvironmentVariables override) rather than one project per stage.
  # ────────────────────────────────────────────────────────────────────────────
  CleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CleanupPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStackResources
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${QaStackName}/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProdStackName}/*"
              - Effect: Allow
                Action:
                  - lambda:GetAlias
                  - lambda:ListVersionsByFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${QaStackName}-*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProdStackName}-*"
              # Trailing :* requires a qualifier (version/alias) in the request's
              # resource ARN — Lambda authorizes DeleteFunction by comparing the
              # policy Resource against both FunctionName and Qualifier, so an
              # unqualified DeleteFunction call (which deletes the whole function,
              # not one version) resolves to the bare function ARN and is denied
              # here, even though this role is otherwise trusted with
              # DeleteFunction on these functions.
              - Effect: Allow
                Action:
                  - lambda:DeleteFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${QaStackName}-*:*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProdStackName}-*:*"

  CleanupProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-cleanup"
      ServiceRole: !GetAtt CleanupRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: cleanup-buildspec.yml

  # ────────────────────────────────────────────────────────────────────────────
  # CloudFormation deploy role — used by the Deploy stages to apply the SAM
  # template. Scoped to AdministratorAccess because SAM creates IAM roles,
  # Lambda functions, DynamoDB tables, event source mappings, and Function URLs.
  # Tighten this for stricter environments.
  # ────────────────────────────────────────────────────────────────────────────
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  # ────────────────────────────────────────────────────────────────────────────
  # CodePipeline role
  # ────────────────────────────────────────────────────────────────────────────
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt BuildProject.Arn
                  - !GetAtt IntegrationTestProject.Arn
                  - !GetAtt CleanupProject.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeChangeSet
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn

  # ────────────────────────────────────────────────────────────────────────────
  # The pipeline
  # A CodeStarSourceConnection source action triggers automatically on push
  # via a GitHub webhook — no separate EventBridge rule needed — but only if
  # GitHubConnectionArn's GitHub App is actually installed on the repo (see
  # that parameter's description). An authorized-but-not-installed connection
  # can still pull source, so this silently degrades to manual-start-only
  # instead of failing loudly.
  #
  # V2 + QUEUED (not the V1 default of SUPERSEDED): ApproveProd is a manual
  # gate that can sit unapproved for days. Under SUPERSEDED, a newer push
  # doesn't preempt an execution already parked in that gate waiting on a
  # human — it just piles up every commit in between into a single
  # "next in line" execution, discarding the individual ones. So approving
  # a long-stale gate deploys whatever was sitting there, not the latest
  # commit, and everything in between silently vanishes rather than getting
  # its own turn. QUEUED processes each execution FIFO, one fully at a time,
  # so what you approve is always exactly what you were shown.
  # ────────────────────────────────────────────────────────────────────────────
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub "${GitHubOwner}/${RepositoryName}"
                BranchName: !Ref BranchName
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact

        - Name: Build
          Actions:
            - Name: BuildAndTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact

        - Name: DeployQA
          Actions:
            - Name: DeployQA
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref QaStackName
                TemplatePath: BuildArtifact::packaged.yaml
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CloudFormationRole.Arn
                ParameterOverrides: !Sub |
                  {
                    "DiscordPublicKey": "{{resolve:secretsmanager:${QaSecretName}:SecretString:DiscordPublicKey}}",
                    "DiscordToken": "{{resolve:secretsmanager:${QaSecretName}:SecretString:DiscordToken}}",
                    "TestPublicKey": "{{resolve:secretsmanager:${QaTestSigningSecretName}:SecretString:TestPublicKey}}"
                  }
                OutputFileName: output.json
              InputArtifacts:
                - Name: BuildArtifact
              OutputArtifacts:
                - Name: QaStackOutput

        - Name: CleanupQA
          Actions:
            - Name: PruneOldVersions
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CleanupProject
                EnvironmentVariables: !Sub |
                  [{"name":"STACK_NAME","value":"${QaStackName}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceArtifact

        - Name: IntegrationTest
          Actions:
            - Name: SmokeTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref IntegrationTestProject
              InputArtifacts:
                - Name: SourceArtifact
                - Name: QaStackOutput

        - Name: ApproveProd
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                CustomData: "Approve to promote the QA build to Production."

        - Name: DeployProd
          Actions:
            - Name: DeployProd
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref ProdStackName
                TemplatePath: BuildArtifact::packaged.yaml
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CloudFormationRole.Arn
                ParameterOverrides: !Sub |
                  {
                    "DiscordPublicKey": "{{resolve:secretsmanager:${ProdSecretName}:SecretString:DiscordPublicKey}}",
                    "DiscordToken": "{{resolve:secretsmanager:${ProdSecretName}:SecretString:DiscordToken}}"
                  }
              InputArtifacts:
                - Name: BuildArtifact

        - Name: CleanupProd
          Actions:
            - Name: PruneOldVersions
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CleanupProject
                EnvironmentVariables: !Sub |
                  [{"name":"STACK_NAME","value":"${ProdStackName}","type":"PLAINTEXT"}]
              InputArtifacts:
                - Name: SourceArtifact

Outputs:
  PipelineUrl:
    Description: Console URL for the pipeline
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view"
  ArtifactBucket:
    Description: Bucket where pipeline artifacts and Lambda packages are stored
    Value: !Ref ArtifactBucket
  GitHubConnectionArn:
    Description: >-
      CodeConnections ARN the Source stage authenticates with. Must reference
      a connection whose GitHub App is actually installed on this repository
      (Settings > Connections > the connection > check for repo access under
      the installed GitHub App, not just an authorized one) — otherwise the
      pipeline can pull source but will never trigger automatically on push.
    Value: !Ref GitHubConnectionArn
