repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^infrastructure/(pipeline\.yaml|template\.yaml)$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(bench_boss|tests)/
      - id: ruff-format
        files: ^(bench_boss|tests)/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: local
    hooks:
      - id: normalize-secrets-baseline
        name: Normalize .secrets.baseline path separators
        entry: python local/normalize_secrets_baseline.py
        language: system
        always_run: true
        pass_filenames: false
